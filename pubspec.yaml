name: vac_dashboard_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  flutter_blue_plus: ^1.32.12
  camera: ^0.10.6
  flutter_secure_storage: ^10.3.1
  mobile_scanner: ^7.2.0
  path: ^1.9.1
  sqflite_sqlcipher: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_native_splash: ^2.4.6

flutter_native_splash:
  color: "#090D16"
  image: assets/app_icon.png
  color_dark: "#090D16"
  image_dark: assets/app_icon.png

  android_12:
    image: assets/app_icon.png
    icon_background_color: "#090D16"
    color: "#090D16"

flutter:
  uses-material-design: true
  assets:
    - lib/data/dummyData.json
    - lib/asset/
    - assets/
